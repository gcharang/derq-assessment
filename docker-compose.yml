services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports:
      - '5432:5432'
    volumes:
      - traffic-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U traffic -d traffic']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  traffic-pgdata:
