services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports:
      - '5432:5432'
    volumes:
      - traffic-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U traffic -d traffic']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_HOST: postgres
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: ./apps/api
    environment:
      DATABASE_HOST: postgres
    command: node dist/scripts/seed.js
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: ./apps/ui
    environment:
      API_URL: http://api:3000
    ports:
      - '3001:3000'
    depends_on:
      - api

volumes:
  traffic-pgdata:
