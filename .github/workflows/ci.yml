name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: apps/api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      # !cancelled() to make sure one failure doesn't hide the others
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Generate OpenAPI spec
        if: ${{ !cancelled() }}
        run: npm run openapi:generate

      - name: Fail if the committed spec is stale
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- openapi.json
